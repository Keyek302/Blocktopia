<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8fd3ff);S.fog=new THREE.Fog(0x8fd3ff,40,130);
const C=new THREE.PerspectiveCamera(65,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x557755,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);S.add(sun);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let total=0;try{total=+localStorage.getItem('bt_coins')||0}catch(e){}

saveCoins();

// ---------- avatar ----------
function limb(g,w,h,d,c,x,y,z){const geo=new THREE.BoxGeometry(w,h,d);geo.translate(0,-h/2,0);const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m}
function makeAvatar(sh,sk,pa){const g=new THREE.Group();
 limb(g,.8,.9,.4,sh,0,1.8,0);limb(g,.7,.7,.7,sk,0,2.5,0);
 for(const x of[-.15,.15]){const e=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.05),new THREE.MeshBasicMaterial({color:0}));e.position.set(x,2.15,.36);g.add(e)}
 g.armL=limb(g,.3,.85,.3,sk,-.6,1.75,0);g.armR=limb(g,.3,.85,.3,sk,.6,1.75,0);
 g.legL=limb(g,.38,.9,.38,pa,-.2,.9,0);g.legR=limb(g,.38,.9,.38,pa,.2,.9,0);return g}
function anim(g,sp,dt){g.ph=(g.ph||0)+sp*dt*1.3;const s=Math.sin(g.ph)*Math.min(sp/6,1)*.9;g.legL.rotation.x=s;g.legR.rotation.x=-s;g.armL.rotation.x=-s;g.armR.rotation.x=s}
const P=makeAvatar(0x2f7de1,0xffd24d,0x333a4d);S.add(P);

// ---------- world helpers ----------
let mode='hub',cur=null,world=new THREE.Group(),plats=[],things=[],bots=[],portals=[],cps=[],bound=0,t=0,score=0,over=false;
const spawn=new THREE.Vector3(),p=new THREE.Vector3(),v=new THREE.Vector3();let on=false,yaw=0;
S.add(world);
function clear(){dropCarry();spd=9;$('shop').style.display='none';shopOpen=0;cancelBuy();document.body.classList.remove('heist','fight');$('cft').style.display='none';$('again').style.display='';S.remove(world);world=new THREE.Group();S.add(world);plats=[];things=[];bots=[];portals=[];cps=[];bound=0;$('ov').style.display='none'}
function box(x,y,z,w,h,d,c,solid=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);world.add(m);if(solid)plats.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,top:y+h/2});return m}
function label(txt,col){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const g=cv.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,512,128);g.fillStyle=col||'#fff';let fs=58;g.font='bold 58px sans-serif';while(g.measureText(txt).width>480&&fs>24){fs-=4;g.font='bold '+fs+'px sans-serif'}g.textAlign='center';g.fillText(txt,256,86);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));s.scale.set(6,1.5,1);return s}
function respawn(){p.copy(spawn);v.set(0,0,0)}
function finish(text,reward){if(over)return;over=true;total+=reward;saveCoins();$('rt').innerHTML='<h2>'+text+'</h2><p>+'+reward+' 🪙</p>';$('ov').style.display='flex'}

// ---------- hub ----------
function grassTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#4fae4f';g.fillRect(0,0,128,128);
 for(let i=0;i<1100;i++){g.fillStyle=['#5cc65c','#3f9a45','#6bd36b','#459f4a'][i%4];g.fillRect(Math.random()*128|0,Math.random()*128|0,2,2+Math.random()*4|0)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(22,22);t.magFilter=THREE.NearestFilter;return t}
function checkTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#e3d9b8';g.fillRect(0,0,64,64);g.fillStyle='#d2c79f';g.fillRect(0,0,32,32);g.fillRect(32,32,32,32);g.strokeStyle='#b8ad88';g.strokeRect(0,0,64,64);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);t.magFilter=THREE.NearestFilter;return t}
let GT=null,CT=null;
function hub(){clear();mode='hub';cur=null;over=false;yaw=0;bound=27;GT=GT||grassTex();CT=CT||checkTex();
 box(0,-.5,0,60,1,60,0xffffff).material.map=GT;box(0,.02,0,18,.04,18,0xffffff,false).material.map=CT;
 const defs=[['Coin Grab',0xffc400,coinGame],['Parkour',0xa05cf0,obbyMenu],['Tag Run',0xe03a3a,tag],['Brainrot',0x2ecc71,steal],['Lava Climb',0xff6a1a,lavaGame],['Sumo',0x4cc9f0,sumo],['Color Floor',0xf72585,colorFloor],['Shop',0xff6fb0,openShop]],PR=17,pp=[];
 defs.forEach(([n,c,f],i)=>{const a=(i+.5)/8*6.283,x=Math.cos(a)*PR,z=Math.sin(a)*PR,d=Math.hypot(x,z);pp.push([x,z]);
  box(x/2,.03,z/2,2.6,.04,d,0xd9c48a,false).rotation.y=Math.atan2(x,z);
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=Math.atan2(-x,-z);world.add(g);
  const M=(w,h,dd,col,px,py)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),new THREE.MeshLambertMaterial({color:col}));m.position.set(px,py,0);g.add(m)};
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,.12,24),new THREE.MeshLambertMaterial({color:0x2f3442}));disc.position.y=.06;g.add(disc);
  M(.9,4.4,.9,0x8b93a1,-2.1,2.2);M(.9,4.4,.9,0x8b93a1,2.1,2.2);M(1.1,.35,1.1,c,-2.1,4.55);M(1.1,.35,1.1,c,2.1,4.55);M(5.3,.6,.9,c,0,4.5);M(1.2,.35,.9,0xffffff,0,4.95);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(3.3,4),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.4,side:THREE.DoubleSide}));pl.position.y=2.2;g.add(pl);
  const l=label(n);l.scale.set(5,1.25,1);l.position.y=6.4;g.add(l);portals.push({x,z,f,m:pl})});
 for(let i=0;i<30;i++){const a=i/30*6.283+Math.random()*.1,r=24+Math.random()*3.5,x=Math.cos(a)*r,z=Math.sin(a)*r;
  box(x,1.2,z,.9,2.4,.9,0x7a5230,false);
  if(i%2){box(x,3.6,z,3.4,2.4,3.4,0x2e8b3a,false);box(x,5.3,z,2.2,1.6,2.2,0x3fa84a,false)}
  else{box(x,3,z,3,1.2,3,0x1f7a3a,false);box(x,4.1,z,2.2,1.2,2.2,0x2a8f45,false);box(x,5.1,z,1.2,1.2,1.2,0x37a352,false)}}
 for(let i=0;i<70;i++){const a=Math.random()*6.283,r=11+Math.random()*12,x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(pp.some(([px,pz])=>Math.hypot(px-x,pz-z)<4.8))continue;
  box(x,.25,z,.08,.5,.08,0x3a8f3a,false);box(x,.6,z,.28,.28,.28,[0xff5c8a,0xffd23f,0xffffff,0xb583ff][i%4],false)}
 box(0,.25,0,4.6,.5,4.6,0x9aa0a8,false);box(0,.52,0,3.8,.12,3.8,0x4cc9f0,false);box(0,1.1,0,.8,1.2,.8,0xb4bac2,false);box(0,1.8,0,1.4,.25,1.4,0xb4bac2,false);box(0,2.15,0,.3,.5,.3,0x4cc9f0,false);
 for(let i=0;i<8;i++)box(Math.random()*90-45,24+Math.random()*6,Math.random()*90-45,8+Math.random()*6,2,5+Math.random()*4,0xffffff,false);
 spawn.set(0,0,8);respawn();lobby();$('msg').textContent='Walk into a portal to play'}

// ---------- minigame 1: coin grab ----------
function addCoin(){const g=new THREE.CylinderGeometry(.5,.5,.12,16);g.rotateX(Math.PI/2);
 const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xffd21f,emissive:0x665500}));
 m.position.set(Math.random()*32-16,1.1,Math.random()*32-16);world.add(m);things.push(m)}
function coinGame(){clear();mode='coin';cur=coinGame;bound=17;box(0,-.5,0,36,1,36,0x3b6fd1);
 [[-8,-8],[8,-8],[-8,8],[8,8]].forEach(([x,z])=>box(x,.9,z,4,1.8,4,0x66b3ff));
 spawn.set(0,0,0);respawn();t=30;score=0;over=false;for(let i=0;i<12;i++)addCoin();rv=makeRivals([[-10,-10],[10,-10],[0,12]])}

// ---------- minigame 2: obby ----------
// ---------- minigame 3: tag run ----------
function tag(){clear();mode='tag';cur=tag;bound=17;box(0,-.5,0,36,1,36,0xd1623b);spawn.set(0,0,0);respawn();t=0;over=false;
 [[-14,-14],[14,-14],[0,15]].forEach(([x,z])=>{const g=makeAvatar(0xd62828,0xcfcfcf,0x222222);g.position.set(x,0,z);world.add(g);bots.push(g)})}

// ---------- minigame 4: brainrot heist ----------
const TIERS=[{n:'Common',pr:15,inc:3,w:50},{n:'Rare',pr:60,inc:9,w:28},{n:'Epic',pr:200,inc:24,w:14},{n:'Legendary',pr:600,inc:70,w:6},{n:'Secret',pr:2000,inc:240,w:2}];
let carry=null,spd=9,cash=0,bank=0,sw=0,swing=0,sbh=0,slh=0,lastSe=0,note='',noteT=0,nm=null,mine=[],rivals=[],belt=[],bt=0;
function dropCarry(){if(carry){P.remove(carry.m);carry=null}spd=9}
function rollTier(max){let r=Math.random()*100;for(let i=0;i<5;i++){r-=TIERS[i].w;if(r<=0)return Math.min(i,max)}return 0}
const COL=[0xaaaaaa,0x3b8bff,0xa05cf0,0xffd21f,0xff3bd0];
function brainrot(ti,price){const T=TIERS[ti],g=new THREE.Group(),
 A=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c,emissive:ti>2?c:0,emissiveIntensity:.25}));m.position.set(x,y,z);g.add(m);return m},
 B=(w,h,d,c,x,y,z)=>A(new THREE.BoxGeometry(w,h,d),c,x,y,z),
 Y=(a,b,h,c,x,y,z)=>A(new THREE.CylinderGeometry(a,b,h,12),c,x,y,z),
 Q=(r,c,x,y,z)=>A(new THREE.SphereGeometry(r,14,10),c,x,y,z),
 E=(x,y,z,s=.14)=>{B(s*1.7,s*1.7,.06,0xffffff,x,y,z);B(s*.8,s*.8,.07,0,x,y,z+.01)};
 const V=[
 [0,'Toast Gnome',()=>{B(1,1.2,.2,0x9c6b30,0,.7,-.08);B(.9,1.1,.3,0xe6c28a,0,.7,0);Y(0,.5,.8,0xd62828,0,1.7,0);E(-.2,.9,.17);E(.2,.9,.17)}],
 [0,'Sock Puppet',()=>{B(.8,1.6,.5,0xffffff,0,.8,0);B(.82,.25,.52,0xd62828,0,.45,0);B(.82,.25,.52,0xd62828,0,1,0);E(-.18,1.3,.27,.16);E(.18,1.3,.27,.16)}],
 [1,'Noodle Cat',()=>{Q(.55,0xffd24d,0,.65,0);Y(0,.18,.4,0xffd24d,-.3,1.3,0);Y(0,.18,.4,0xffd24d,.3,1.3,0);for(const x of[-.25,0,.25])Y(.05,.05,.7,0xfff2b0,x,.3,.52);E(-.2,.8,.55);E(.2,.8,.55)}],
 [1,'Cactus Bro',()=>{Y(.45,.5,1.5,0x2e9b4a,0,.75,0);Y(.14,.14,.6,0x2e9b4a,-.6,1,0);Y(.14,.14,.6,0x2e9b4a,.6,1,0);B(.3,.3,.3,0xff6fb0,0,1.65,0);B(.85,.22,.06,0x111111,0,1.05,.5)}],
 [2,'Disco Shark',()=>{B(.9,1,1.2,0x7a8ca0,0,.6,0);Y(0,.3,.7,0x5c6b7e,0,1.4,0);B(.8,.15,.06,0xffffff,0,.4,.62);E(-.25,.9,.61);E(.25,.9,.61);Q(.25,0xffffff,0,2,0)}],
 [2,'Rocket Frog',()=>{Q(.6,0x4cd964,0,.6,0);Q(.2,0xffffff,-.3,1.15,.3);Q(.2,0xffffff,.3,1.15,.3);B(.1,.1,.05,0,-.3,1.15,.5);B(.1,.1,.05,0,.3,1.15,.5);Y(.15,.15,.9,0xdddddd,0,.8,-.6);Y(0,.15,.4,0xd62828,0,1.4,-.6);Y(.15,0,.4,0xff9f1c,0,.15,-.6)}],
 [3,'Crown Croc',()=>{B(.8,.8,1.6,0x2e8b3a,0,.5,0);B(.8,.6,.6,0x2e8b3a,0,.8,.9);for(const x of[-.25,0,.25])Y(0,.15,.4,0xffd21f,x,1.3,.9);B(.7,.1,.06,0xffffff,0,.62,1.21);E(-.2,1,1.21);E(.2,1,1.21)}],
 [3,'Pizza Wizard',()=>{Y(0,.7,1.3,0xf4a82a,0,.65,0);Q(.1,0xc0392b,0,.25,.5);Q(.1,0xc0392b,-.25,.3,.4);Q(.1,0xc0392b,.25,.3,.4);Y(0,.4,.9,0x6c3bd1,0,1.75,0);Y(.6,.6,.06,0x6c3bd1,0,1.3,0);E(-.15,.65,.3);E(.15,.65,.3)}],
 [4,'Cosmic Egg',()=>{Q(.65,0xff3bd0,0,.9,0);const r=A(new THREE.TorusGeometry(.95,.05,8,24),0xffffff,0,.9,0);r.rotation.x=1.2;for(const[x,y,z]of[[1,1.6,0],[-1,.4,.3],[.4,1.9,-.5],[-.6,1.7,.6]])B(.18,.18,.18,0xffee58,x,y,z);E(-.2,1.05,.6,.16);E(.2,1.05,.6,.16)}]];
 const pool=V.filter(v=>v[0]===ti),v=pool[Math.random()*pool.length|0];v[2]();A(new THREE.CylinderGeometry(.85,.85,.08,16),COL[ti],0,.04,0);
 g.nm=v[1];g.relabel=pr=>{if(g.lab)g.remove(g.lab);g.lab=label(g.nm+(pr?' $'+T.pr:' +'+T.inc+'/s'),'#'+COL[ti].toString(16).padStart(6,'0'));g.lab.scale.set(3,.75,1);g.lab.position.y=2.6;g.add(g.lab)};
 g.relabel(price);g.ti=ti;return g}
function addMine(m,ti){let i=0;while(mine.some(q=>q.i===i))i++;mine.push({m,ti,i});placeMine(m,i)}
function nearMine(){let b=null,bd=2.6;for(const q of mine){const d=Math.hypot(p.x-q.m.position.x,p.z-q.m.position.z);if(d<bd){bd=d;b=q}}return b}
function sell(){const q=nearMine();if(!q)return;const v=Math.floor(TIERS[q.ti].pr*.5);cash+=v;world.remove(q.m);mine.splice(mine.indexOf(q),1);note='Sold '+q.m.nm+' +$'+v;noteT=2}
function placeMine(m,i){m.scale.set(1,1,1);m.rotation.y=0;m.position.set(-10+i*4,0,18);world.add(m)}
function steal(){clear();mode='steal';document.body.classList.add('heist');cur=steal;bound=26;over=false;t=120;cash=30;bank=0;mine=[];belt=[];bt=0;rivals=[];

// ---------- color floor ----------
let tiles=[],cfRound=0,cfPhase=0,cfT=0,cfTarget=0;const CFC=[0xe03a3a,0x2ecc71,0x3b8bff,0xffd21f],CFN=['🟥 RED','🟩 GREEN','🟦 BLUE','🟨 YELLOW'];
function colorFloor(){clear();mode='cf';cur=colorFloor;over=false;t=0;tiles=[];cfRound=0;
 for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){const x=i*5+2.5,z=j*5+2.5,m=box(x,-.25,z,4.8,.5,4.8,0x888888);tiles.push({m,b:plats[plats.length-1],x,z,c:0,alive:true,fall:false})}

 for(const r of rv){if(r.out)continue;const g=r.g,gp=g.position,under=tiles.some(q=>q.alive&&Math.abs(q.x-gp.x)<2.4&&Math.abs(q.z-gp.z)<2.4);

  else{r.vy-=30*dt;gp.y+=r.vy*dt;if(gp.y<-8){r.out=true;g.visible=false}}}

 if(cfT<=0){
  if(cfPhase===0){cfPhase=1;cfT=1.8;for(const q of tiles)if(q.c!==cfTarget){q.alive=false;q.fall=true;const i=plats.indexOf(q.b);if(i>=0)plats.splice(i,1)}}

 $('msg').textContent=(cfPhase===0?'Stand on '+CFN[cfTarget]+'! ':'Hold on... ')+'Round '+(cfRound+1)+'/10 · Bots: '+rv.filter(r=>!r.out).length;
 {const c=$('cft');c.style.display='flex';c.style.background='#'+CFC[cfTarget].toString(16).padStart(6,'0');c.textContent=CFN[cfTarget].slice(3);c.style.opacity=cfPhase===0?1:.45}
 if(p.y<-4)finish('You fell on round '+(cfRound+1)+'!',cfRound*7+3)}

// ---------- input ----------
const K={};let jh=0;const joy={x:0,y:0};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(k===' '||k.startsWith('arrow'))e.preventDefault();if(k==='escape')hub()});

const jz=$('joy'),kn=$('knob');let jid=null;

$('jb').addEventListener('pointerdown',()=>jh=1);$('jb').addEventListener('pointerup',()=>jh=0);$('jb').addEventListener('pointercancel',()=>jh=0);

// ---------- update ----------
function update(dt){
 let mx=0,mz=0;
 if(!over){
  const ix=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+joy.x,iz=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0)+joy.y;
  const l=Math.hypot(ix,iz),f=l>1?1/l:1,s=Math.sin(yaw),c=Math.cos(yaw);

 }
 v.y-=32*dt;const py=p.y;
 stand=null;p.x+=(mx*spd+kx)*dt;p.z+=(mz*spd+kz)*dt;kx-=kx*Math.min(1,5*dt);kz-=kz*Math.min(1,5*dt);p.y+=v.y*dt;
 if(bound){p.x=Math.max(-bound,Math.min(bound,p.x));p.z=Math.max(-bound,Math.min(bound,p.z))}
 on=false;
 for(const b of plats)if(p.x>b.x0-.25&&p.x<b.x1+.25&&p.z>b.z0-.25&&p.z<b.z1+.25&&py>=b.top-.05&&p.y<=b.top&&v.y<=0){p.y=b.top;v.y=0;on=true;stand=b}
 if(p.y<-15)respawn();
 P.position.copy(p);
 const sp=Math.hypot(mx,mz)*spd;
 if(sp>.5){let a=Math.atan2(mx,mz)-P.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));P.rotation.y+=a*Math.min(1,dt*14)}
 anim(P,sp,dt);cosUpdate(dt,sp);
 const tx=p.x,ty=p.y+1.8,tz=p.z,D=shopOpen?5:9,pc=.45;
 C.position.set(tx+Math.sin(yaw)*D*Math.cos(pc),ty+Math.sin(pc)*D,tz+Math.cos(yaw)*D*Math.cos(pc));C.lookAt(tx,ty-(shopOpen?1.6:0),tz);

 if(mode==='hub'){npcUpdate(dt);for(const q of portals)if(Math.hypot(p.x-q.x,p.z-q.z)<2&&p.y<3){q.f();return}}
 else if(over){return}
 else if(mode==='coin'){
  t-=dt;things.forEach(m=>m.rotation.y+=dt*3);rivalCoins(dt);
  for(let i=things.length-1;i>=0;i--){const m=things[i];if(Math.hypot(p.x-m.position.x,p.z-m.position.z)<1.3&&Math.abs(p.y+1-m.position.y)<2){world.remove(m);things.splice(i,1);score++;addCoin()}}
  $('msg').textContent='⏱ '+Math.ceil(Math.max(t,0))+'s · You '+score+' · '+rv.map(r=>r.nm.slice(0,5)+' '+r.score).join(' · ');
  if(t<=0){const all=[{n:'You',s:score},...rv.map(r=>({n:r.nm,s:r.score}))].sort((a,b)=>b.s-a.s),pl=all.findIndex(a=>a.n==='You')+1;finish('Time! '+['🥇 1st','🥈 2nd','🥉 3rd','4th'][pl-1]+' with '+score+' coins<br><small>'+all.map(a=>a.n+' '+a.s).join(' · ')+'</small>',score+[15,8,4,0][pl-1])}
 }else if(mode==='obby'){
  t+=dt;rivalObby(dt);for(const q of movers){const nx=q.cx+Math.sin(t*q.sp+q.ph)*q.A,dx=nx-q.m.position.x;q.m.position.x=nx;q.b.x0=nx-q.w/2;q.b.x1=nx+q.w/2;if(stand===q.b)p.x+=dx}
  $('msg').textContent='Lvl '+obLvl+' · ⏱ '+t.toFixed(1)+'s · reach the gold platform'+(noteT>0?' · '+note:'');
  for(const c of cps)if(on&&Math.hypot(p.x-c.x,p.z-c.z)<2&&Math.abs(p.y-c.top)<.3){
   if(c.fin){{const pl=order.length+1;finish('You finished in '+t.toFixed(1)+'s — '+['🥇 1st','🥈 2nd','🥉 3rd','4th'][pl-1]+'!',(Math.max(10,80-Math.floor(t))+[20,10,5,0][pl-1])*obLvl);unlocked=Math.max(unlocked,obLvl+1);try{localStorage.setItem('bt_lvl',unlocked)}catch(e){}if(obLvl<5)$('rt').innerHTML+='<button onclick="obby('+(obLvl+1)+')">Next level ▶</button>'};return}
   spawn.set(c.x,c.top,c.z)}
 }else if(mode==='lava'){lavaUpdate(dt)}else if(mode==='sumo'){sumoUpdate(dt)}else if(mode==='cf'){cfUpdate(dt)
 }else if(mode==='steal'){
  sw=Math.max(0,sw-dt);swing=Math.max(0,swing-dt);
  if((K.f||K.j||sbh)&&sw<=0&&!over){sw=.5;swing=.2;bots.forEach((g,i)=>{const r=rivals[i],dx=g.position.x-p.x,dz=g.position.z-p.z,d=Math.hypot(dx,dz)||1;
   if(d<2.6&&dx*Math.sin(P.rotation.y)+dz*Math.cos(P.rotation.y)>0){r.stun=1.8;say(g,'Ow!');g.position.x+=dx/d*2.5;g.position.z+=dz/d*2.5;
    if(r.hold){const m=r.hold.m;g.remove(m);m.scale.set(1,1,1);m.position.set(g.position.x,.1,-2);world.add(m);m.relabel(1);belt.push({m,ti:m.ti});r.hold.s.res=false;r.hold=null}}})}
  if(swing>0)P.armR.rotation.x=-2.2;
  t-=dt;let inc=0;for(const q of mine)inc+=TIERS[q.ti].inc;bank+=inc*dt;if(Math.abs(p.x)<1.8&&Math.abs(p.z-10)<1.8&&p.y<1.5&&bank>=.01){cash+=bank;bank=0}
  {const se=K.e||slh;if(se&&!lastSe)sell();lastSe=se;noteT-=dt}

  }
  if(carry&&p.z>8.5&&Math.abs(p.x)<15&&mine.length<6){const m=carry.m;P.remove(m);addMine(m,carry.ti);carry=null;spd=9}
  bots.forEach((g,i)=>{if(g.sbt>0&&(g.sbt-=dt)<=0&&g.sb){g.remove(g.sb);g.sb=null}const r=rivals[i],pd=Math.hypot(p.x-g.position.x,p.z-g.position.z);
   let ri=1;for(const q of r.slots)if(q.m)ri+=TIERS[q.m.ti].inc;r.cash+=ri*dt;

   const ch=(carry&&carry.r===r)||(pd<4&&p.z<-8);let tx=r.cx+Math.sin(t*.8+i*2)*4,tz=-11,sp=3;
   if(ch){tx=p.x;tz=p.z;sp=5.5}
   else if(r.hold){const s=r.hold.s;tx=s.x;tz=-14;sp=5;if(Math.hypot(g.position.x-s.x,g.position.z+16)<2.6){const m=r.hold.m;g.remove(m);m.scale.set(1,1,1);m.rotation.y=0;m.position.set(s.x,0,-16);world.add(m);m.relabel();s.m=m;s.res=false;r.hold=null}}
   else{const fs=r.slots.find(q=>!q.m&&!q.res);let low=null;if(!fs)for(const q of r.slots)if(q.m&&(!low||q.m.ti<low.m.ti))low=q;

    if(bi>=0){const b=belt[bi];tx=b.m.position.x+1.5;tz=-2;sp=5.5;
     if(Math.hypot(g.position.x-b.m.position.x,g.position.z+2)<1.6){if(!fs){world.remove(low.m);low.m=null;r.cash+=bonus}r.cash-=TIERS[b.ti].pr;belt.splice(bi,1);ts.res=true;r.hold={m:b.m,s:ts};b.m.relabel();world.remove(b.m);g.add(b.m);b.m.scale.set(.8,.8,.8);b.m.position.set(0,2.9,0);b.m.rotation.y=0}}}
   const dx=tx-g.position.x,dz=tz-g.position.z,d=Math.hypot(dx,dz);

   if(ch&&pd<1.1&&p.y<1.3){if(carry){const m=carry.m,q=carry.s;P.remove(m);m.scale.set(1,1,1);m.position.set(q.x,0,-16);world.add(m);q.m=m;carry=null;spd=9}say(g,'Gotcha!');respawn()}});
  $('msg').textContent='⏱ '+Math.ceil(Math.max(t,0))+'s · $'+Math.floor(cash)+' · 🟩 $'+Math.floor(bank)+' (+'+inc+'/s) · '+mine.length+'/6 slots'+(carry?' · '+TIERS[carry.ti].n+' from '+carry.r.nm+' → run home!':'')+(noteT>0?' · '+note:(nm=nearMine())?' · E: sell '+nm.m.nm+' $'+Math.floor(TIERS[nm.ti].pr*.5):'');
