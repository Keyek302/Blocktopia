#joy{left:24px;width:120px;height:120px;border-radius:50%;background:#fff3;border:2px solid #fff6}

<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8fd3ff);S.fog=new THREE.Fog(0x8fd3ff,40,130);
const C=new THREE.PerspectiveCamera(65,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x557755,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);S.add(sun);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let total=0;try{total=+localStorage.getItem('bt_coins')||0}catch(e){}
function saveCoins(){try{localStorage.setItem('bt_coins',total)}catch(e){}$('coins').textContent='🪙 '+total}
saveCoins();

// ---------- avatar ----------
function limb(g,w,h,d,c,x,y,z){const geo=new THREE.BoxGeometry(w,h,d);geo.translate(0,-h/2,0);const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m}
function makeAvatar(sh,sk,pa){const g=new THREE.Group();
 limb(g,.8,.9,.4,sh,0,1.8,0);limb(g,.7,.7,.7,sk,0,2.5,0);
 for(const x of[-.15,.15]){const e=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.05),new THREE.MeshBasicMaterial({color:0}));e.position.set(x,2.15,.36);g.add(e)}
 g.armL=limb(g,.3,.85,.3,sk,-.6,1.75,0);g.armR=limb(g,.3,.85,.3,sk,.6,1.75,0);
 g.legL=limb(g,.38,.9,.38,pa,-.2,.9,0);g.legR=limb(g,.38,.9,.38,pa,.2,.9,0);return g}
function anim(g,sp,dt){g.ph=(g.ph||0)+sp*dt*1.3;const s=Math.sin(g.ph)*Math.min(sp/6,1)*.9;g.legL.rotation.x=s;g.legR.rotation.x=-s;g.armL.rotation.x=-s;g.armR.rotation.x=s}
const P=makeAvatar(0x2f7de1,0xffd24d,0x333a4d);S.add(P);

// ---------- world helpers ----------
let mode='hub',cur=null,world=new THREE.Group(),plats=[],things=[],bots=[],portals=[],cps=[],bound=0,t=0,score=0,over=false;
const spawn=new THREE.Vector3(),p=new THREE.Vector3(),v=new THREE.Vector3();let on=false,yaw=0;
S.add(world);
function clear(){dropCarry();spd=9;$('shop').style.display='none';shopOpen=0;document.body.classList.remove('heist');S.remove(world);world=new THREE.Group();S.add(world);plats=[];things=[];bots=[];portals=[];cps=[];bound=0;$('ov').style.display='none'}
function box(x,y,z,w,h,d,c,solid=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);world.add(m);if(solid)plats.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,top:y+h/2});return m}
function label(txt,col){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const g=cv.getContext('2d');g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,512,128);g.fillStyle=col||'#fff';let fs=58;g.font='bold 58px sans-serif';while(g.measureText(txt).width>480&&fs>24){fs-=4;g.font='bold '+fs+'px sans-serif'}g.textAlign='center';g.fillText(txt,256,86);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));s.scale.set(6,1.5,1);return s}
function respawn(){p.copy(spawn);v.set(0,0,0)}
function finish(text,reward){if(over)return;over=true;total+=reward;saveCoins();$('rt').innerHTML='<h2>'+text+'</h2><p>+'+reward+' 🪙</p>';$('ov').style.display='flex'}

// ---------- hub ----------

 box(0,-.5,0,60,1,60,0x59c25a);box(0,.02,0,16,.04,16,0xe3d6a8,false);
 for(let i=0;i<16;i++){const a=i/16*6.283+Math.random()*.3,r=21+Math.random()*5,x=Math.cos(a)*r,z=Math.sin(a)*r;box(x,1,z,.8,2,.8,0x7a5230,false);box(x,3.2,z,3,3,3,0x2e8b3a,false)}
 [['Coin Grab',0xffc400,coinGame,-18,-12],['Obby',0xa05cf0,obby,-6,-17],['Tag Run',0xe03a3a,tag,6,-17],['Brainrot',0x2ecc71,steal,18,-12],['Shop',0xff6fb0,openShop,15,13]].forEach(([n,c,f,x,z])=>{

  const m=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.6),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.4,side:THREE.DoubleSide}));m.position.set(x,2,z);world.add(m);
  const l=label(n);l.position.set(x,6,z);world.add(l);portals.push({x,z,f})});

function coinGame(){clear();mode='coin';cur=coinGame;bound=17;box(0,-.5,0,36,1,36,0x3b6fd1);
 [[-8,-8],[8,-8],[-8,8],[8,8]].forEach(([x,z])=>box(x,.9,z,4,1.8,4,0x66b3ff));
 spawn.set(0,0,0);respawn();t=30;score=0;over=false;for(let i=0;i<12;i++)addCoin();rv=makeRivals([[-10,-10],[10,-10],[0,12]])}

// ---------- minigame 2: obby ----------
function obby(){clear();mode='obby';cur=obby;wps=[{x:0,z:0,top:0}];order=[];box(0,-.5,0,8,1,8,0x8a5cf0);spawn.set(0,0,0);respawn();t=0;over=false;
 for(let i=1;i<=17;i++){const top=i*.5,x=Math.sin(i*1.2)*3.5,z=-i*6.5,fin=i===17,cp=i===9,s=fin?7:Math.max(2.6,4-i*.1);
  const col=fin?0xffd21f:cp?0x2ecc71:new THREE.Color().setHSL(i/18,.7,.55).getHex();
  box(x,top-.25,z,s,.5,s,col);wps.push({x,z,top});if(fin||cp)cps.push({x,z,top,fin})}

// ---------- minigame 3: tag run ----------
function tag(){clear();mode='tag';cur=tag;bound=17;box(0,-.5,0,36,1,36,0xd1623b);spawn.set(0,0,0);respawn();t=0;over=false;

// ---------- minigame 4: brainrot heist ----------

function rollTier(max){let r=Math.random()*100;for(let i=0;i<5;i++){r-=TIERS[i].w;if(r<=0)return Math.min(i,max)}return 0}
const COL=[0xaaaaaa,0x3b8bff,0xa05cf0,0xffd21f,0xff3bd0];

 A=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c,emissive:ti>2?c:0,emissiveIntensity:.25}));m.position.set(x,y,z);g.add(m);return m},
 B=(w,h,d,c,x,y,z)=>A(new THREE.BoxGeometry(w,h,d),c,x,y,z),

 const V=[
 [0,'Toast Gnome',()=>{B(1,1.2,.2,0x9c6b30,0,.7,-.08);B(.9,1.1,.3,0xe6c28a,0,.7,0);Y(0,.5,.8,0xd62828,0,1.7,0);E(-.2,.9,.17);E(.2,.9,.17)}],
 [0,'Sock Puppet',()=>{B(.8,1.6,.5,0xffffff,0,.8,0);B(.82,.25,.52,0xd62828,0,.45,0);B(.82,.25,.52,0xd62828,0,1,0);E(-.18,1.3,.27,.16);E(.18,1.3,.27,.16)}],
 [1,'Noodle Cat',()=>{Q(.55,0xffd24d,0,.65,0);Y(0,.18,.4,0xffd24d,-.3,1.3,0);Y(0,.18,.4,0xffd24d,.3,1.3,0);for(const x of[-.25,0,.25])Y(.05,.05,.7,0xfff2b0,x,.3,.52);E(-.2,.8,.55);E(.2,.8,.55)}],
 [1,'Cactus Bro',()=>{Y(.45,.5,1.5,0x2e9b4a,0,.75,0);Y(.14,.14,.6,0x2e9b4a,-.6,1,0);Y(.14,.14,.6,0x2e9b4a,.6,1,0);B(.3,.3,.3,0xff6fb0,0,1.65,0);B(.85,.22,.06,0x111111,0,1.05,.5)}],
 [2,'Disco Shark',()=>{B(.9,1,1.2,0x7a8ca0,0,.6,0);Y(0,.3,.7,0x5c6b7e,0,1.4,0);B(.8,.15,.06,0xffffff,0,.4,.62);E(-.25,.9,.61);E(.25,.9,.61);Q(.25,0xffffff,0,2,0)}],
 [2,'Rocket Frog',()=>{Q(.6,0x4cd964,0,.6,0);Q(.2,0xffffff,-.3,1.15,.3);Q(.2,0xffffff,.3,1.15,.3);B(.1,.1,.05,0,-.3,1.15,.5);B(.1,.1,.05,0,.3,1.15,.5);Y(.15,.15,.9,0xdddddd,0,.8,-.6);Y(0,.15,.4,0xd62828,0,1.4,-.6);Y(.15,0,.4,0xff9f1c,0,.15,-.6)}],
 [3,'Crown Croc',()=>{B(.8,.8,1.6,0x2e8b3a,0,.5,0);B(.8,.6,.6,0x2e8b3a,0,.8,.9);for(const x of[-.25,0,.25])Y(0,.15,.4,0xffd21f,x,1.3,.9);B(.7,.1,.06,0xffffff,0,.62,1.21);E(-.2,1,1.21);E(.2,1,1.21)}],
 [3,'Pizza Wizard',()=>{Y(0,.7,1.3,0xf4a82a,0,.65,0);Q(.1,0xc0392b,0,.25,.5);Q(.1,0xc0392b,-.25,.3,.4);Q(.1,0xc0392b,.25,.3,.4);Y(0,.4,.9,0x6c3bd1,0,1.75,0);Y(.6,.6,.06,0x6c3bd1,0,1.3,0);E(-.15,.65,.3);E(.15,.65,.3)}],
 [4,'Cosmic Egg',()=>{Q(.65,0xff3bd0,0,.9,0);const r=A(new THREE.TorusGeometry(.95,.05,8,24),0xffffff,0,.9,0);r.rotation.x=1.2;for(const[x,y,z]of[[1,1.6,0],[-1,.4,.3],[.4,1.9,-.5],[-.6,1.7,.6]])B(.18,.18,.18,0xffee58,x,y,z);E(-.2,1.05,.6,.16);E(.2,1.05,.6,.16)}]];
 const pool=V.filter(v=>v[0]===ti),v=pool[Math.random()*pool.length|0];v[2]();A(new THREE.CylinderGeometry(.85,.85,.08,16),COL[ti],0,.04,0);
 g.nm=v[1];g.relabel=pr=>{if(g.lab)g.remove(g.lab);g.lab=label(g.nm+(pr?' $'+T.pr:' +'+T.inc+'/s'),'#'+COL[ti].toString(16).padStart(6,'0'));g.lab.scale.set(3,.75,1);g.lab.position.y=2.6;g.add(g.lab)};

function addMine(m,ti){let i=0;while(mine.some(q=>q.i===i))i++;mine.push({m,ti,i});placeMine(m,i)}

function placeMine(m,i){m.scale.set(1,1,1);m.rotation.y=0;m.position.set(-10+i*4,0,18);world.add(m)}
function steal(){clear();mode='steal';document.body.classList.add('heist');cur=steal;bound=26;over=false;t=120;cash=30;bank=0;mine=[];belt=[];bt=0;rivals=[];
 box(0,-.5,0,56,1,56,0x4a4f5c);box(0,.02,-2,52,.04,3,0x2b2b2b,false);box(0,.02,16,30,.04,14,0x3b8bff,false);
 for(let i=0;i<6;i++)box(-10+i*4,.06,18,2.4,.1,2.4,0x2a62c4,false);
 box(0,.08,10,3.5,.1,3.5,0x2ecc71,false);{const l=label('COLLECT');l.scale.set(3,.75,1);l.position.set(0,1.8,10);world.add(l)}
 const nn=[...NN].sort(()=>Math.random()-.5);
 [-14,14].forEach(cx=>{box(cx,.02,-16,16,.04,10,0xd13a3a,false);const r={cx,slots:[],cash:40,hold:null,stun:0};
  for(let k=-1;k<=1;k++){const x=cx+k*4,m=k?null:brainrot(rollTier(1));if(m){m.position.set(x,0,-16);world.add(m)}r.slots.push({x,m,t:0})}
  rivals.push(r);const nm=nn.pop(),g=rivalAvatar(nm);r.nm=nm;g.position.set(cx,0,-11);world.add(g);bots.push(g)});

// ---------- cosmetic shop ----------
const CAT={shirt:['Shirts',[['blue','Blue',0],['red','Red',30],['green','Green',30],['pink','Pink',40],['purple','Purple',50],['black','Midnight',60],['orange','Orange',30],['teal','Ocean',40],['snow','Snow',40],['gold','Gold',150],['neon','Neon',100],['rb','Rainbow',250]]],
 hat:['Hats',[['none','No hat',0],['cap','Cap',40],['top','Top Hat',60],['wiz','Wizard Hat',100],['crown','Crown',120],['cow','Cowboy',90],['bun','Bunny Ears',70],['prop','Propeller',150],['halo','Halo',200]]],
 trail:['Trails',[['none','No trail',0],['spark','Sparkle',80],['fire','Fire',120],['heart','Hearts',100],['snow','Snowfall',90],['bubble','Bubbles',110],['rain','Rainbow',200]]],
 face:['Faces',[['none','Default',0],['smile','Smile',30],['angry','Grumpy',50],['stache','Mustache',60],['shades','Shades',40],['heart','Heart Eyes',80],['cat','Cat',100],['visor','Visor',120]]]};
const SHC={blue:0x2f7de1,red:0xe03a3a,green:0x2ecc71,pink:0xff6fb0,purple:0xa05cf0,black:0x222831,gold:0xffd21f,orange:0xff8c1a,teal:0x1abc9c,snow:0xf2f2f2,neon:0x39ff14};
let cos={own:['shirt:blue','hat:none','trail:none','face:none'],eq:{shirt:'blue',hat:'none',trail:'none',face:'none'}},tab='shirt',shopOpen=0,parts=[],trT=0;
try{const sv=JSON.parse(localStorage.getItem('bt_cos'));if(sv&&sv.own&&sv.eq)cos=sv}catch(e){}
cos.eq.face=cos.eq.face||'none';if(!cos.own.includes('face:none'))cos.own.push('face:none');
const TC={heart:0xff6fb0,snow:0xffffff,bubble:0x7fe3ff};
function saveCos(){try{localStorage.setItem('bt_cos',JSON.stringify(cos))}catch(e){}}
function makeHat(id){if(id==='none')return null;const g=new THREE.Group(),
 A=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m},
 Bx=(w,h,d,c,x,y,z)=>A(new THREE.BoxGeometry(w,h,d),c,x,y,z),Cy=(a,b,h,c,x,y,z)=>A(new THREE.CylinderGeometry(a,b,h,14),c,x,y,z);

  $('msg').textContent='Survive! ⏱ '+Math.min(t,30).toFixed(1)+' / 30s (jump over them)';
 }
}
